# Do not modify. This file is automatically generated.
# Changes will be overwritten.
name: sysreptor

networks:
  frontend:
    external: true
  backend_sysreptor:
    external: true


services:
  db:
    image: 'postgres:14'
    container_name: 'sysreptor-db'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reportcreator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reportcreator}
      POSTGRES_DB: ${POSTGRES_NAME:-reportcreator}
      PGDATA: /data
    volumes:
      - ${BASE_PATH}/sysreptor/db-data:/data
      # - db-data:/data
    expose:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reportcreator"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    stop_grace_period: 120s
    networks:
      - backend_sysreptor

  redis:
    image: redis:8.0-alpine
    command: sh -c "exec redis-server --requirepass $${REDIS_PASSWORD:-}"
    environment:
      REDIS_PASSWORD: reportcreator
    expose:
      - 6379
    restart: unless-stopped
    networks:
      - backend_sysreptor

  app:
    #image: 'syslifters/sysreptor:${SYSREPTOR_VERSION:-latest}'
    image: 'gitea.bawow.de/alex/sysreptor:${SYSREPTOR_VERSION:-latest}'
    # build: ../../
    container_name: 'sysreptor-app'
    init: true

    volumes:
      - ${BASE_PATH}/sysreptor/app-data:/data
      # - app-data:/data
    expose:
      - 8000
    ports:
      - '8000:8000'
      # - ${BIND_PORT:-127.0.0.1:8000:8000}
    environment:
      DATABASE_HOST: ${POSTGRES_HOST:-db}
      DATABASE_NAME: ${POSTGRES_NAME:-reportcreator}
      DATABASE_USER: ${POSTGRES_USER:-reportcreator}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-reportcreator}
      DATABASE_PORT: ${POSTGRES_PORT:-5432}
      REDIS_URL: redis://${REDIS_USER-}:${REDIS_PASSWORD:-reportcreator}@${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/${REDIS_INDEX:-0}
      SPELLCHECK_URL: ${LANGUAGETOOL_URL:-http://languagetool:8010}
      HTTP_PROXY: ${SYSREPTOR_HTTP_PROXY:-${HTTP_PROXY:-${http_proxy:-}}}
      http_proxy: ${SYSREPTOR_HTTP_PROXY:-${HTTP_PROXY:-${http_proxy:-}}}
      HTTPS_PROXY: ${SYSREPTOR_HTTPS_PROXY:-${HTTPS_PROXY:-${https_proxy:-}}}
      https_proxy: ${SYSREPTOR_HTTPS_PROXY:-${HTTPS_PROXY:-${https_proxy:-}}}
      NO_PROXY: ${SYSREPTOR_NO_PROXY:-${NO_PROXY:-${no_proxy:-}}}
      no_proxy: ${SYSREPTOR_NO_PROXY:-${NO_PROXY:-${no_proxy:-}}}
      TZ: ${TZ}
      #PUID: ${PUID}
      #GUID: ${GUID}
    env_file:
      - stack.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/public/utils/healthcheck/"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend_sysreptor

  languagetool:
    image: syslifters/sysreptor-languagetool:${SYSREPTOR_VERSION:-latest}
    container_name: 'sysreptor-languagetool'
    init: true
    environment:
      languagetool_dbHost: ${POSTGRES_HOST:-db}
      languagetool_dbName: ${POSTGRES_NAME:-reportcreator}
      languagetool_dbUsername: ${POSTGRES_USER:-reportcreator}
      languagetool_dbPassword: ${POSTGRES_PASSWORD:-reportcreator}
      languagetool_dbPort: ${POSTGRES_PORT:-5432}
      HTTP_PROXY: ${SYSREPTOR_HTTP_PROXY:-${HTTP_PROXY:-${http_proxy:-}}}
      http_proxy: ${SYSREPTOR_HTTP_PROXY:-${HTTP_PROXY:-${http_proxy:-}}}
      HTTPS_PROXY: ${SYSREPTOR_HTTPS_PROXY:-${HTTPS_PROXY:-${https_proxy:-}}}
      https_proxy: ${SYSREPTOR_HTTPS_PROXY:-${HTTPS_PROXY:-${https_proxy:-}}}
      NO_PROXY: ${SYSREPTOR_NO_PROXY:-${NO_PROXY:-${no_proxy:-}}}
      no_proxy: ${SYSREPTOR_NO_PROXY:-${NO_PROXY:-${no_proxy:-}}}
    expose:
      - 8010
    healthcheck:
      test: ["CMD", "curl", "-f", "-so", "/dev/null", "http://localhost:8010/v2/languages"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    depends_on:
      db: 
        condition: service_healthy
    networks:
      - backend_sysreptor

