services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: tailscale
    hostname: NAS
    restart: unless-stopped
    cap_add:
      - net_admin
    devices:
      - /dev/net/tun:/dev/net/tun
    environment: 
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_HOSTNAME=nas-restricted
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true             
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234       
      - TS_EXTRA_ARGS=--accept-routes --advertise-routes=${TS_ROUTES}  
      - TS_ACCEPT_DNS=false  
    volumes: 
      - ${BASE_PATH}/tailscale/config:/config
      - ${BASE_PATH}/tailscale/state:/var/lib/tailscale
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"] 
      interval: 1m 
      timeout: 10s 
      retries: 3 
      start_period: 10s 
