networks:
  frontend:
    external: true

services:
  heimdall:
    image: lscr.io/linuxserver/heimdall:latest
    container_name: heimdall
    restart: unless-stopped
    env_file:
      - stack.env
    volumes:
      - ${BASE_PATH}/heimdall/config:/config
    ports:
      - 8082:80
    networks:
      - frontend
